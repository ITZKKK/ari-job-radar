# Employers the radar watches. The single source of truth for employer
# coverage: add a row here, never in code.
#
# Easiest way to add one:   python scripts/add_employer.py "Name" "<careers URL>"
# (it reads the job-board platform off the URL and appends a row).
#
# Fields
#   id          short unique slug
#   name        shown on the dashboard and in emails
#   group       what kind of employer (free text, shown under the name)
#   city        where its relevant jobs mostly are
#   target      true = on Ari's own list; gets a ★ everywhere
#   ats         job-board platform: greenhouse | lever | ashby | smartrecruiters | workday |
#               workable | bamboohr | recruitee | breezy | oracle | ukg   (read automatically)
#               none | teamtailor | jobvite | avature | successfactors | email | ...  (not readable)
#   ats_token / ats_site / ats_dc / ats_host   the board's identifiers
#   verified    true once the board was checked to be THIS employer's (unverified rows are not read)
#   queries     server-side keyword searches, for huge boards (Workday / Oracle / SmartRecruiters)
#   must_match  regex; keep only postings mentioning it (a brand on a parent company's board)
#   careers_url the human careers page (linked on the dashboard)
#   watch_url   page to watch for changes when there is no readable board (defaults to careers_url)
#   aliases     other names job sites use for it (so aggregator finds get the ★)
#   target_match  regex; on a parent's board, only postings matching it count as Ari's pick (★)
#   linkedin_url  the company's LinkedIn page (shown as a "LinkedIn jobs" link; never fetched)
#   home        MIAMI = this employer's jobs can only be in Miami, so a posting
#               that states no location is treated as Miami. Opt-in: set it only
#               on Miami-only rows (not on a parent with boards in 30 markets).
#   note        anything Ari should know
#
# Ari and Itz can also add a company from the dashboard ("Add a company" opens
# a GitHub issue form; the requests workflow appends the row here).
#
# Research behind every row: 19 Oct 2026 (see README, "Employer research").

