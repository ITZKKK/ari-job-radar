# The dashboard's "Add a company" button opens this form. The field LABELS
# below are what scripts/handle_request.py reads (GitHub renders a form as
# "### Label / value"), so keep them identical to LABELS in that script.
name: Add a company
description: Ask the radar to watch another company's jobs.
title: "Add company: "
labels: [add-company]
body:
  - type: markdown
    attributes:
      value: >
        Put the company's name in the title too (after "Add company:"). The
        radar adds it within a few minutes and replies here.
  - type: input
    id: company
    attributes:
      label: Company name
      placeholder: World Red Eye
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Website or careers page
      description: The page where it lists jobs, if you know it. Any page on its site works.
      placeholder: https://worldredeye.com
  - type: input
    id: linkedin
    attributes:
      label: LinkedIn page
      description: Optional. Gives you a "LinkedIn jobs" link on the radar.
      placeholder: https://www.linkedin.com/company/world-red-eye/
  - type: checkboxes
    id: target
    attributes:
      label: Your list
      options:
        - label: This is one of my picks (give it a ★)
