name: radar

# Three runs a day, in New York time roughly 7:20am, 1:20pm and 7:20pm
# (cron is UTC; offset off the hour to dodge GitHub's peak). "Run workflow"
# in the Actions tab is the manual refresh. Editing a YAML file or the page on
# GitHub republishes the dashboard without crawling.
on:
  schedule:
    - cron: "21 11,17,23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "boards.yaml", "employers.yaml", "config.yaml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      email_failed: ${{ steps.email.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Scheduled / manual runs crawl. A push only re-exports the dashboard
      # data, except the very first push, which also does the first crawl.
      - name: Crawl
        if: github.event_name != 'push' || hashFiles('data/state.json') == ''
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JSEARCH_RAPIDAPI_KEY: ${{ secrets.JSEARCH_RAPIDAPI_KEY }}
          RADAR_PASSCODE: ${{ secrets.RADAR_PASSCODE }}
        run: python src/crawl.py

      - name: Refresh dashboard data only (config or page edited)
        if: github.event_name == 'push' && hashFiles('data/state.json') != ''
        run: python src/crawl.py --export-only

      # A failed email must not lose the crawl, so the commit and publish steps
      # still run; the job is marked failed at the end so GitHub emails the
      # repo owner.
      - name: Email Ari
        id: email
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python src/notify.py

      - name: Save state to the repo
        run: |
          git config user.name  "job-radar"
          git config user.email "actions@github.com"
          git add data/                      # incl. data/inbox_employers.yaml, written from the dashboard's inbox
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "radar $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done

      - name: Build the site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/radar.json _site/data/radar.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: crawl
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Fail visibly if the email step failed
        if: needs.crawl.outputs.email_failed == 'true'
        run: |
          echo "::error::The email step failed — open the 'Email Ari' step of the crawl job for the reason."
          exit 1
